name: geopulse
version: 1.0.0
config-version: 2

profile: geopulse

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests/dbt"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages
  - logs

models:
  geopulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  geopulse:
    +quote_columns: false
