name: GeoPulse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
