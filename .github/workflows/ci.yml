name: GeoPulse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile source and DAGs
        run: python -m compileall -q src dags

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  test-orchestration:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/geopulse-airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      GEOPULSE_PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Apache Airflow
        run: >-
          python -m pip install
          "apache-airflow==3.3.2"
          "apache-airflow-providers-standard==1.19.0"
          --constraint
          "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"

      - name: Install GeoPulse package
        run: python -m pip install --editable .

      - name: Validate Airflow DAG structure
        run: python -m unittest discover -s tests -p "test_airflow_dag.py" -v

  test-spatial:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install spatial dependencies
        run: python -m pip install --editable ".[spatial]"

      - name: Run Apache Sedona integration tests
        run: python -m unittest discover -s tests -p "test_spatial.py" -v

  test-dbt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt adapters
        run: python -m pip install --editable ".[analytics]"

      - name: Load synthetic spatial fixtures
        run: dbt seed --profiles-dir profiles/ci --target ci --full-refresh

      - name: Build and test analytics models
        run: dbt build --profiles-dir profiles/ci --target ci --exclude-resource-type seed

      - name: Validate Snowflake project parsing
        run: dbt parse --profiles-dir profiles/snowflake --target snowflake --no-partial-parse

  test-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Test dashboard data contracts
        run: npm run test

      - name: Audit production dependencies
        run: npm run audit:critical

      - name: Build production dashboard
        run: npm run build
