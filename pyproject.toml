[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geopulse"
version = "0.1.0"
description = "Hyper-local retail mobility analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rajveer Gill" }
]
dependencies = []

[project.optional-dependencies]
spatial = [
  "apache-sedona==1.9.0",
  "pandas==2.3.3",
  "pyspark==4.0.4",
]
analytics = [
  "dbt-core==1.12.5",
  "dbt-duckdb==1.11.0",
  "dbt-snowflake==1.12.1",
]
orchestration = [
  "apache-airflow==3.3.2",
  "apache-airflow-providers-standard==1.19.0",
]

[project.scripts]
geopulse-generate = "geopulse.synthetic:main"
geopulse-spatial-join = "geopulse.spatial:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
