[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geopulse"
version = "0.1.0"
description = "Hyper-local retail mobility analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rajveer Gill" }
]
dependencies = []

[project.optional-dependencies]
spatial = [
  "apache-sedona==1.9.0",
  "pandas==2.3.3",
  "pyspark==4.0.4",
]
analytics = [
  "dbt-core==1.12.5",
  "dbt-duckdb==1.11.0",
  "dbt-snowflake==1.12.1",
]
warehouse = [
  "snowflake-connector-python==4.7.4",
]
quality = [
  "ruff==0.17.0",
]
orchestration = [
  "apache-airflow==3.3.2",
  "apache-airflow-providers-standard==1.19.0",
]

[project.scripts]
geopulse-generate = "geopulse.synthetic:main"
geopulse-spatial-join = "geopulse.spatial:main"
geopulse-validate-spatial = "geopulse.quality:main"
geopulse-load-spatial = "geopulse.warehouse:main"
geopulse-load-raw = "geopulse.raw_warehouse:main"
geopulse-export-dashboard = "geopulse.dashboard_export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["target", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
